name: Fix Effects Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-effects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch effects behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/Timeline.tsx')
          s = p.read_text()

          if 'effectsOpenId' not in s:
              s = s.replace(
                  "const [editingTextId,setEditingTextId]=useState<string|null>(null);",
                  "const [editingTextId,setEditingTextId]=useState<string|null>(null); const [effectsOpenId,setEffectsOpenId]=useState<string|null>(null);"
              )
              s = s.replace(
                  "const [editingTextId, setEditingTextId] = useState<string | null>(null);",
                  "const [editingTextId, setEditingTextId] = useState<string | null>(null); const [effectsOpenId, setEffectsOpenId] = useState<string | null>(null);"
              )

          s = s.replace(
              "const showEffects = !!selectedClip && (selectedClip.type === 'video' || selectedClip.type === 'image');",
              "const showEffects = !!selectedClip && effectsOpenId === selectedClip.id && (selectedClip.type === 'video' || selectedClip.type === 'image');"
          )

          # Only the dedicated + button toggles the effects tray.
          s = s.replace(
              "onMouseDown={e=>{e.stopPropagation();onSelectClip(c.id);}} className=\"absolute z-20 flex items-center justify-center w-5 h-5",
              "onMouseDown={e=>{e.stopPropagation();onSelectClip(c.id);setEffectsOpenId(v=>v===c.id?null:c.id);}} className=\"absolute z-20 flex items-center justify-center w-5 h-5"
          )

          # Body-effect cards must have real ids so clicking them updates the clip.
          body = {
            'Electric Rays':'electricRays','Neon Glow Outline':'neonGlowOutline','Lightning Strokes':'lightningStrokes','Laser Aura':'laserAura',
            'Glowing Eyes':'glowingEyes','Halo Ring':'haloRing','Angel Wings':'angelWings','Demon Horns':'demonHorns','Floating Crown':'floatingCrown',
            'Disappearing Clone':'disappearingClone','Shadow Trail':'shadowTrail','RGB Echo':'rgbEcho','Speed Phantom':'speedPhantom',
            'Super Saiyan Flame':'superSaiyanFlame','Particle Burst':'particleBurst','Galaxy Sparkles':'galaxySparkles','Cosmic Pulse':'cosmicPulse',
            'Background Matrix':'backgroundMatrix','Fire Ring Behind':'fireRingBehind','Grid Aura':'gridAura'
          }
          for name, ident in body.items():
              s = s.replace("{ name: '%s', desc:" % name, "{ name: '%s', id: '%s', desc:" % (name, ident))

          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Timeline.tsx
          if git diff --cached --quiet; then echo "No source changes"; exit 0; fi
          git commit -m "Fix effects panel toggle and body effect IDs"
          git push
