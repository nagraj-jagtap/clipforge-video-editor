name: Fix Media Effects
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-media-effects.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch media effects rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/CenterPreview.tsx')
          s=p.read_text()
          s=s.replace("  const activeVideoClip = clips.find(\n    (c) => c.type === 'video' && currentTime >= c.startTime && currentTime < c.startTime + c.duration\n  );", "  const activeVideoClip = clips.find(\n    (c) => (c.type === 'video' || c.type === 'image') && currentTime >= c.startTime && currentTime < c.startTime + c.duration\n  );")
          s=s.replace("  // Synchronize HTML5 video element with timeline currentTime\n  useEffect(() => {\n    if (!videoRef.current || !activeVideoClip) return;", "  // Synchronize HTML5 video element with timeline currentTime\n  useEffect(() => {\n    if (!videoRef.current || !activeVideoClip || activeVideoClip.type !== 'video') return;")
          s=s.replace("                filter: getCssFilterString(activeVideoClip),", "                filter: [getCssFilterString(activeVideoClip), activeVideoClip.effect === 'rgbSplit' ? 'drop-shadow(3px 0 0 rgba(255,0,80,0.7)) drop-shadow(-3px 0 0 rgba(0,240,255,0.7))' : activeVideoClip.effect === 'blur' ? 'blur(4px)' : ''].filter(Boolean).join(' '),")
          s=s.replace("                  referrerPolicy=\"no-referrer\"", "                  referrerPolicy=\"no-referrer\"")
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/CenterPreview.tsx
          git commit -m "Make effects apply to image and video clips" || exit 0
          git push
